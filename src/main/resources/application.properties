# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# WARNING: Intentionally weak JWT secret (VULNERABILITY: API8-Weak Authentication)
#app.jwt.secret=secret123
# Unreasonably long token validity (VULNERABILITY: API8)
#app.jwt.ttl-seconds=2592000

# Expose error details (VULNERABILITY: API7-Security Misconfiguration)
server.error.include-message=always
server.error.include-stacktrace=always

logging.level.root=INFO

# JWT Token Settings
app.jwt.secret=ThisIsAReallyLongAndVerySecureSecretKeyForJWTsPleaseChangeMe
app.jwt.ttl_ms=3600000

# ===============================
# TASK 5: RATE LIMITING (BUCKET4J)
# ===============================
#
# This block enables a filter for our API
bucket4j.filters[0].enabled=true
#
# We will limit the LOGIN endpoint to prevent brute-force attacks
bucket4j.filters[0].url=^/api/auth/login.*
#
# This sets the limit: 5 requests per 1 minute
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
#
# This identifies users by their IP address
bucket4j.filters[0].rate-limits[0].expression=getRemoteAddr()